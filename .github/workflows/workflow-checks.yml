name: Workflow checks

on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-checks:
    uses: ./.github/workflows/reusable-workflow-checks.yml
