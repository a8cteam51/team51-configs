name: block.json Schema Check

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      node-version:
        description: 'Node.js version'
        type: string
        required: false
        default: '26'

permissions: {}

jobs:
  validate:
    name: Validate block.json files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Validate block.json files against the WordPress schema
        working-directory: ${{ inputs.project-path }}
        run: |
          # Validate one file per -d invocation; a single joined string breaks multi-block plugins.
          mapfile -d '' files < <(find . -path ./node_modules -prune -o -path ./vendor -prune -o -name 'block.json' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No block.json files found — nothing to validate."
            exit 0
          fi
          # schemas.wp.org publishes no versioned block.json path; trunk is the only (mutable) schema source.
          # ajv-cli reads -s from disk and picks its parser from the extension, so fetch to a .json path; curl -f fails this check on a schemas.wp.org outage.
          schema="$(mktemp -d)/schema.json"
          curl -fsSL https://schemas.wp.org/trunk/block.json -o "$schema"
          for file in "${files[@]}"; do
            echo "Validating $file"
            npx --yes ajv-cli@5.0.0 validate \
              -s "$schema" \
              -d "$file" \
              --strict=false
          done
