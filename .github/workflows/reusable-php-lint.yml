name: PHP Lint

on:
  workflow_call:
    inputs:
      scripts:
        description: 'Non-empty JSON array of composer scripts; each runs as its own parallel job.'
        type: string
        required: true
      php-version:
        description: 'PHP version to run against.'
        type: string
        required: false
        default: '8.5'
      project-path:
        description: 'Path to the project (relative to repo root).'
        type: string
        required: false
        default: '.'
      composer-options:
        description: 'Composer install options passed to the dependency-install step.'
        type: string
        required: false
        default: '--prefer-dist --ignore-platform-req=php+'

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      # An empty JSON array expands to zero matrix jobs and reports success — a silent skip of the lint.
      - name: Reject an empty scripts array
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          if ! jq -e 'type == "array" and length > 0' <<< "$SCRIPTS" > /dev/null; then
            echo "::error::scripts must be a non-empty JSON array — got '$SCRIPTS'."
            exit 1
          fi

  lint:
    name: ${{ matrix.script }}
    needs: validate-inputs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(inputs.scripts) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: ${{ inputs.composer-options }}
      - name: composer ${{ matrix.script }}
        working-directory: ${{ inputs.project-path }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: composer "$SCRIPT"
